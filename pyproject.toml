[project]
name = "mergedog"
version = "0.1.0"
description = "Autonomous shepherd for OSS PR contributions to pytorch/pytorch"
requires-python = ">=3.11"
dependencies = [
    "ghstack>=0.15.0",
    "textual>=8.2.5",
]

[project.scripts]
mergedog = "mergedog.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mergedog"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PLW", "RUF"]
ignore = [
    "E501",    # long lines: prompts and log messages are often wide
    "SIM117",  # nested with-statements read fine in tests
    "PLW0603", # module-level state is used deliberately for process globals
    "RUF012",  # Textual class attributes (CSS, BINDINGS) are mutable by convention
    "PLW2901", # `line = line.strip()` inside loops is idiomatic here
]

[tool.ruff.lint.isort]
known-first-party = ["mergedog"]
